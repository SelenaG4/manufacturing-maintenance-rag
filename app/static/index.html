<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Manufacturing Maintenance Assistant</title>
<style>
  :root { --navy:#0f2c4c; --navy2:#163a63; --ink:#1b2733; --muted:#5b6b7b; --line:#dfe6ee;
          --bg:#f4f7fb; --card:#fff; --accent:#2f6fb0; --chip:#eef3f9; }
  * { box-sizing:border-box; } body { margin:0; background:var(--bg); color:var(--ink);
      font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif; line-height:1.55; }
  header { background:linear-gradient(135deg,var(--navy),var(--navy2)); color:#fff; padding:32px 20px; }
  .wrap { max-width:820px; margin:0 auto; padding:0 20px; }
  header h1 { margin:0 0 6px; font-size:24px; } header p { margin:0; opacity:.9; }
  main { padding:24px 0 60px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:18px; margin:16px 0;
          box-shadow:0 1px 2px rgba(16,44,76,.04); }
  .askrow { display:flex; gap:8px; } input[type=text]{ flex:1; padding:12px 14px; font-size:15px;
          border:1px solid var(--line); border-radius:9px; }
  button { background:var(--accent); color:#fff; border:0; border-radius:9px; padding:12px 18px; font-size:15px; cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
  .chips { margin-top:10px; display:flex; flex-wrap:wrap; gap:6px; }
  .chip { background:var(--chip); color:var(--navy); border:0; border-radius:999px; padding:6px 12px; font-size:13px; cursor:pointer; }
  .answer { white-space:pre-wrap; }
  .answer b, .answer strong { color:var(--navy); }
  .mode { display:inline-block; font-size:12px; padding:3px 9px; border-radius:999px; background:#e8f0f8; color:var(--navy); margin-bottom:10px; }
  .sources { margin-top:14px; border-top:1px solid var(--line); padding-top:10px; }
  .src { font-size:13px; padding:6px 0; color:var(--muted); }
  .src b { color:var(--ink); } .score { color:var(--accent); font-variant-numeric:tabular-nums; }
  .muted { color:var(--muted); font-size:14px; }
</style>
</head>
<body>
<header><div class="wrap">
  <h1>🛠️ Manufacturing Maintenance Assistant</h1>
  <p>Ask a maintenance or troubleshooting question. Answers are retrieved from the machine-maintenance
     guides (semantic search over a FAISS vector index) and every answer cites its sources.</p>
</div></header>

<main class="wrap">
  <div class="card">
    <div class="askrow">
      <input id="q" type="text" placeholder="e.g. The spindle on my mill is overheating — what should I check?" />
      <button id="go">Ask</button>
    </div>
    <div class="chips" id="chips"></div>
  </div>
  <div id="out"></div>
  <p class="muted" id="status"></p>
</main>

<script>
  const $ = s => document.querySelector(s);
  const EXAMPLES = [
    "The spindle on my mill is running too hot",
    "Parts keep slipping in the lathe chuck",
    "What does fault code HYD-07 mean?",
    "How do I know if the spindle bearings are wearing out?",
    "What's the lockout/tagout procedure?",
    "I'm getting burn marks on parts from the grinder",
  ];
  const chips = $("#chips");
  EXAMPLES.forEach(x => { const b=document.createElement("button"); b.className="chip"; b.textContent=x;
    b.onclick=()=>{ $("#q").value=x; ask(); }; chips.appendChild(b); });

  function md(t){ return t.replace(/&/g,"&amp;").replace(/</g,"&lt;")
    .replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>"); }

  async function ask(){
    const q = $("#q").value.trim(); if(!q) return;
    $("#go").disabled=true; $("#out").innerHTML='<div class="card muted">Searching the guides…</div>';
    try{
      const r = await fetch("/ask",{method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({question:q})});
      if(!r.ok) throw new Error("HTTP "+r.status);
      const d = await r.json();
      const modeLabel = {offline_extractive:"grounded · extractive (offline)", openai:"grounded · OpenAI",
        azure_openai:"grounded · Azure OpenAI", no_answer:"no grounded match"}[d.mode] || d.mode;
      const srcs = d.sources.map(s=>`<div class="src">• <b>${s.doc_title} — ${s.heading}</b>
        <span class="score">(${s.score.toFixed(3)})</span> · ${s.source_file}</div>`).join("");
      $("#out").innerHTML = `<div class="card">
        <span class="mode">${modeLabel}</span>
        <div class="answer">${md(d.answer)}</div>
        ${d.sources.length?`<div class="sources"><b>Sources</b>${srcs}</div>`:""}
      </div>`;
    }catch(e){ $("#out").innerHTML=`<div class="card">Error: ${e.message}</div>`; }
    $("#go").disabled=false;
  }
  $("#go").onclick=ask;
  $("#q").addEventListener("keydown",e=>{ if(e.key==="Enter") ask(); });

  fetch("/health").then(r=>r.json()).then(h=>{
    $("#status").textContent = h.index_loaded
      ? `Index: ${h.chunks} chunks loaded · generation mode: ${h.generation_mode}`
      : "Index not loaded — run scripts/build_index.py";
  }).catch(()=>{});
</script>
</body>
</html>
