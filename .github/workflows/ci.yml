name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install system libs for FAISS
        run: sudo apt-get update && sudo apt-get install -y libgomp1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run test suite
        # Chunking, FAISS retrieval quality, the grounded-answer + guardrail
        # behavior, the retrieval-metric functions, and the API end to end.
        run: pytest tests/ -v

      - name: Gate on retrieval quality
        # Runs on pull requests too, so a change that degrades retrieval is
        # visible in review rather than discovered after merge. Same script the
        # CD pipeline runs, so the check cannot drift between the two.
        run: python scripts/gate_retrieval.py
